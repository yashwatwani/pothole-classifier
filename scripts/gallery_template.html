<title>Pothole Test Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: inspection sheet. Summary matrix up top doubles as the filter, then a dense photo grid. */
:root {
  --bg: #eceff1;
  --surface: #ffffff;
  --ink: #1b2024;
  --muted: #5a646b;
  --line: #d3d9dd;
  --marking: #d9a300;
  --marking-ink: #1b2024;
  --good: #2b7a4b;
  --good-soft: #e3f1e8;
  --bad: #c03a28;
  --bad-soft: #fbe6e2;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181b; --surface: #1d2327; --ink: #e7ebee; --muted: #9aa5ad; --line: #2e363c;
    --marking: #f0c02c; --marking-ink: #14181b;
    --good: #5cc28a; --good-soft: #1b3326; --bad: #f06a58; --bad-soft: #3a1f1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181b; --surface: #1d2327; --ink: #e7ebee; --muted: #9aa5ad; --line: #2e363c;
  --marking: #f0c02c; --marking-ink: #14181b;
  --good: #5cc28a; --good-soft: #1b3326; --bad: #f06a58; --bad-soft: #3a1f1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; }

header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 28px; height: 4px; background: repeating-linear-gradient(90deg, var(--marking) 0 10px, transparent 10px 16px); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 44px); line-height: 1.05; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.lede b { color: var(--ink); font-weight: 600; }

.matrix { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.cell {
  appearance: none; text-align: left; cursor: pointer; font: inherit; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; display: grid; gap: 2px; position: relative;
}
.cell:hover { border-color: var(--muted); }
.cell:focus-visible, select:focus-visible, .chip:focus-visible, .more:focus-visible { outline: 2px solid var(--marking); outline-offset: 2px; }
.cell[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 -4px 0 var(--marking); }
.cell .n { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.cell .k { font-weight: 600; font-size: 14px; }
.cell .d { font-size: 12px; color: var(--muted); }
.cell.ok .n { color: var(--good); }
.cell.err .n { color: var(--bad); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.controls label { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
select { font: 500 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; text-transform: none; letter-spacing: 0; }
.chip { appearance: none; font: 500 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.count { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.card.wrong { border-color: var(--bad); }
.ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--line); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.verdict { position: absolute; top: 8px; left: 8px; font-family: var(--display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; padding: 2px 8px; border-radius: 4px; background: var(--marking); color: var(--marking-ink); }
.verdict.no { background: var(--surface); color: var(--ink); }
.flag { position: absolute; top: 8px; right: 8px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--bad); color: #fff; }
.body { padding: 10px 12px 12px; display: grid; gap: 8px; align-content: start; }
.meter { display: grid; gap: 4px; }
.meter .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.meter .top b { font-family: var(--mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--marking); border-radius: 4px; }
.bar::after { content: ""; position: absolute; left: var(--cut, 50%); top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; font-weight: 500; }
dd.right { color: var(--good); }
dd.miss { color: var(--bad); }
.file { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }

.more { justify-self: center; font: 600 14px var(--body); color: var(--marking-ink); background: var(--marking); border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.legend .tick { width: 2px; height: 12px; background: var(--ink); opacity: .55; display: inline-block; }

@media (max-width: 720px) {
  .matrix { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .count { margin-left: 0; width: 100%; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { animation: in .25s ease both; }
  @keyframes in { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Held-out test set · v2 model, 384 px · cutoff set per camera</div>
    <h1>Pothole Test Gallery</h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="matrix" id="matrix" role="group" aria-label="Filter by outcome"></div>

  <div class="controls">
    <label for="source">Photos
      <select id="source">
        <option value="all">All photos</option>
        <option value="cam:vehicle">All vehicle cameras</option>
        <option value="cam:handheld">All handheld phones</option>
        <option value="rdd_india">India, vehicle camera (RDD2022)</option>
        <option value="miia">South Africa dashcam (MIIA)</option>
        <option value="kerala">Kerala, handheld</option>
        <option value="taroii">taroii, handheld</option>
      </select>
    </label>
    <label for="sort">Sort
      <select id="sort">
        <option value="wrong">Wrong calls first</option>
        <option value="unsure">Least sure first</option>
        <option value="high">Pothole chance: high to low</option>
        <option value="low">Pothole chance: low to high</option>
      </select>
    </label>
    <button class="chip" id="fixed" type="button" aria-pressed="false">Fixed since old model</button>
    <button class="chip" id="worse" type="button" aria-pressed="false">Worse than old model</button>
    <button class="chip" id="disagree" type="button" aria-pressed="false">Clef-flash disagrees</button>
    <span class="legend"><span class="tick"></span> line = cutoff for that camera; above it we say pothole</span>
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid"></div>
  <button class="more" id="more" type="button">Show more</button>
</div>

<script>
const DATA = /*DATA*/[];
const PAGE = 48;
const SOURCE_NAME = { miia: "South Africa dashcam", kerala: "Kerala, handheld", taroii: "taroii, handheld", rdd_india: "India, vehicle camera" };
const OUTCOMES = [
  { id: "tp", k: "Potholes caught", d: "pothole, model said pothole", cls: "ok", test: i => i.truth && i.pred },
  { id: "fn", k: "Potholes missed", d: "pothole, model said no", cls: "err", test: i => i.truth && !i.pred },
  { id: "fp", k: "False alarms", d: "normal road, model said pothole", cls: "err", test: i => !i.truth && i.pred },
  { id: "tn", k: "Normal roads cleared", d: "normal road, model said no", cls: "ok", test: i => !i.truth && !i.pred },
];
const state = { outcome: null, source: "all", sort: "wrong", disagree: false, fixed: false, worse: false, shown: PAGE };
const $ = id => document.getElementById(id);
const pct = p => (p * 100).toFixed(p >= 0.995 || p <= 0.005 ? 1 : 0) + "%";

function inSource(i) {
  if (state.source === "all") return true;
  return state.source.startsWith("cam:") ? i.camera === state.source.slice(4) : i.source === state.source;
}

function renderMatrix() {
  const pool = DATA.filter(inSource);
  const correct = pool.filter(i => i.pred === i.truth).length;
  const potholes = pool.filter(i => i.truth).length;
  const caught = pool.filter(i => i.truth && i.pred).length;
  $("lede").innerHTML = `<b>${pool.length}</b> road photos the model never saw in training. ` +
    `It got <b>${correct}</b> right (${pct(correct / Math.max(pool.length, 1))}) and caught ` +
    `<b>${caught} of ${potholes}</b> potholes. Tap a box to see only those photos.`;
  $("matrix").innerHTML = OUTCOMES.map(o => {
    const n = pool.filter(o.test).length;
    return `<button type="button" class="cell ${o.cls}" data-id="${o.id}" aria-pressed="${state.outcome === o.id}">
      <span class="n">${n}</span><span class="k">${o.k}</span><span class="d">${o.d}</span></button>`;
  }).join("");
}

function filtered() {
  let rows = DATA.filter(inSource);
  if (state.outcome) rows = rows.filter(OUTCOMES.find(o => o.id === state.outcome).test);
  if (state.disagree) rows = rows.filter(i => i.clef !== null && i.clef !== i.pred);
  if (state.fixed) rows = rows.filter(i => i.old !== i.truth && i.pred === i.truth);
  if (state.worse) rows = rows.filter(i => i.old === i.truth && i.pred !== i.truth);
  const by = {
    wrong: (a, b) => ((a.pred === a.truth) - (b.pred === b.truth)) || (Math.abs(b.p - b.cut) - Math.abs(a.p - a.cut)),
    unsure: (a, b) => Math.abs(a.p - a.cut) - Math.abs(b.p - b.cut),
    high: (a, b) => b.p - a.p,
    low: (a, b) => a.p - b.p,
  }[state.sort];
  return rows.slice().sort(by);
}

function card(i) {
  const wrong = i.pred !== i.truth;
  const clef = i.clef == null ? "not run" : i.clef ? "Pothole" : "No pothole";
  const clefCls = i.clef == null ? "" : i.clef === i.truth ? "right" : "miss";
  return `<article class="card${wrong ? " wrong" : ""}">
    <div class="ph">
      <img src="${i.img}" alt="${i.truth ? "Road with a pothole" : "Road without a pothole"}, ${SOURCE_NAME[i.source]} set">
      <span class="verdict${i.pred ? "" : " no"}">${i.pred ? "Pothole" : "No pothole"}</span>
      ${wrong ? `<span class="flag">${i.truth ? "Missed" : "False alarm"}</span>` : ""}
    </div>
    <div class="body">
      <div class="meter">
        <div class="top"><span>Pothole chance</span><b>${pct(i.p)}</b></div>
        <div class="bar" style="--cut:${(i.cut * 100).toFixed(1)}%"><i style="width:${(i.p * 100).toFixed(1)}%"></i></div>
      </div>
      <dl>
        <dt>Actually</dt><dd>${i.truth ? "Pothole" : "Normal road"}</dd>
        <dt>Old model</dt><dd class="${i.old === i.truth ? "right" : "miss"}">${i.old ? "Pothole" : "No pothole"}</dd>
        <dt>Clef-flash</dt><dd class="${clefCls}">${clef}</dd>
        <dt>Source</dt><dd>${SOURCE_NAME[i.source]}</dd>
      </dl>
      <div class="file">${i.file}</div>
    </div>
  </article>`;
}

function render() {
  renderMatrix();
  const rows = filtered();
  const shown = rows.slice(0, state.shown);
  $("grid").innerHTML = shown.length ? shown.map(card).join("") : `<p class="empty">No photos match these filters.</p>`;
  $("count").textContent = `${shown.length} of ${rows.length} photos`;
  $("more").hidden = rows.length <= state.shown;
  $("more").textContent = `Show ${Math.min(PAGE, rows.length - state.shown)} more`;
}

$("matrix").addEventListener("click", e => {
  const b = e.target.closest(".cell");
  if (!b) return;
  state.outcome = state.outcome === b.dataset.id ? null : b.dataset.id;
  state.shown = PAGE;
  render();
});
$("source").addEventListener("change", e => { state.source = e.target.value; state.shown = PAGE; render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; state.shown = PAGE; render(); });
for (const key of ["disagree", "fixed", "worse"]) {
  $(key).addEventListener("click", e => {
    state[key] = !state[key];
    e.currentTarget.setAttribute("aria-pressed", state[key]);
    state.shown = PAGE;
    render();
  });
}
$("more").addEventListener("click", () => { state.shown += PAGE; render(); });
if (!DATA.some(i => i.clef != null)) $("disagree").hidden = true;
render();
</script>
